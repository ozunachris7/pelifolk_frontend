<div class="flex h-full flex-col bg-white dark:bg-[#171717]">
  <nav class="flex-1 px-4 py-7" aria-label="Navegación principal">
    @for (item of items; track item.path) {
      <a
        class="mb-1 flex items-center gap-3 rounded-xl px-4 py-3 text-xs text-stone-500 transition hover:bg-stone-50 focus-visible:outline-2 focus-visible:outline-amber-600 dark:text-stone-400 dark:hover:bg-white/5 [&.active]:bg-green-50 [&.active]:font-semibold [&.active]:text-green-900 dark:[&.active]:bg-white/10 dark:[&.active]:text-green-200"
        [routerLink]="['/dashboard', item.path]"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        (click)="navigate.emit()">
        <lucide-icon [img]="item.icon" [size]="20" aria-hidden="true" />
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>
  <div class="mx-6 border-t border-stone-100 py-5 text-xs font-semibold dark:border-white/10">
    Pelifolk <span class="mt-1 block text-[10px] font-normal text-stone-400">Gestión del hato</span>
  </div>
</div>
